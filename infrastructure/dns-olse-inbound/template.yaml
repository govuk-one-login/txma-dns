AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Creates all necessary DNS resources in the Fraud SSF account

Parameters:
  Environment:
    Description: Name of Environment to deploy to
    Type: String
    AllowedValues:
      - build
      - staging
      - integration
      - production

Conditions:
  IsProduction: !Equals
    - !Ref Environment
    - production

Resources:

  ###########
  # Receiver #
  ###########

  FraudSSFReceiverApiPublicHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - IsProduction
        - receiver.signal-exchange.account.gov.uk
        - !Sub 'receiver.signal-exchange.${Environment}.account.gov.uk'

  # Note: DNS delegation NS records for the receiver and cognito hosted zones are defined in the
  # dns-olse-outbound template (infrastructure/dns-olse-outbound/template.yaml) because the parent
  # SignalExchangeHostedZone lives in the Shared Signals AWS account. CloudFormation cannot create
  # Route 53 records cross-account, so the delegation must be managed from the account that owns
  # the parent hosted zone.

  FraudSSFReceiverApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !If
        - IsProduction
        - receiver.signal-exchange.account.gov.uk
        - !Sub 'receiver.signal-exchange.${Environment}.account.gov.uk'
      DomainValidationOptions:
        - DomainName: !If
            - IsProduction
            - receiver.signal-exchange.account.gov.uk
            - !Sub 'receiver.signal-exchange.${Environment}.account.gov.uk'
          HostedZoneId: !GetAtt FraudSSFReceiverApiPublicHostedZone.Id
      ValidationMethod: DNS

  FraudSSFReceiverApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3002 # Required as EndpointAccessMode gets flagged as "Additional property not allowed" which means that cfn-lint does not recognise this property as valid even though it is, this is possibly a fairly new property added that cfn-lint has not been able to update its validation schema.
    Properties:
      DomainName: !If
        - IsProduction
        - receiver.signal-exchange.account.gov.uk
        - !Sub 'receiver.signal-exchange.${Environment}.account.gov.uk'
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref FraudSSFReceiverApiCertificate
      SecurityPolicy: SecurityPolicy_TLS13_1_2_PQ_2025_09
      EndpointAccessMode: BASIC

  FraudSSFReceiverApiDomainNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: FraudSSFReceiverApiDomainName
      Type: String
      Value: !Ref FraudSSFReceiverApiDomainName

  FraudSSFReceiverApiAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt FraudSSFReceiverApiDomainName.RegionalDomainName
        EvaluateTargetHealth: false
        HostedZoneId: !GetAtt FraudSSFReceiverApiDomainName.RegionalHostedZoneId
      HostedZoneId: !GetAtt FraudSSFReceiverApiPublicHostedZone.Id
      Name: !Ref FraudSSFReceiverApiDomainName
      Type: A

  ###########
  # Cognito #
  ###########

  FraudSSFReceiverCognitoPublicHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - IsProduction
        - auth.receiver.signal-exchange.account.gov.uk
        - !Sub 'auth.receiver.signal-exchange.${Environment}.account.gov.uk'
