AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Creates all necessary DNS resources in the Shared Signals account

Parameters:
  Environment:
    Description: Name of Environment to deploy to
    Type: String
    AllowedValues:
      - build
      - staging
      - integration
      - production

Conditions:
  IsProduction: !Equals
    - !Ref Environment
    - production
  MockReceiverCustomDomain: !Or
    - !Equals [!Ref Environment, staging]
    - !Equals [!Ref Environment, build]

Mappings:
  ReceiverNameServers: # Name servers from the Fraud SSF account's receiver hosted zones (dns-olse-inbound template) because the Parent Hosted Zone sits in this template here under SignalExchangeHostedZone and value cannot be fetched cross-account
    build:
      Receiver: ns-1113.awsdns-11.org,ns-425.awsdns-53.com,ns-1848.awsdns-39.co.uk,ns-863.awsdns-43.net
      CognitoReceiver: ns-294.awsdns-36.com,ns-567.awsdns-06.net,ns-1193.awsdns-21.org,ns-2009.awsdns-59.co.uk
    staging:
      Receiver: ns-76.awsdns-09.com,ns-1133.awsdns-13.org,ns-1020.awsdns-63.net,ns-1674.awsdns-17.co.uk
      CognitoReceiver: ns-592.awsdns-10.net,ns-1623.awsdns-10.co.uk,ns-1261.awsdns-29.org,ns-325.awsdns-40.com
    integration:
      Receiver: ns-336.awsdns-42.com,ns-590.awsdns-09.net,ns-1813.awsdns-34.co.uk,ns-1440.awsdns-52.org
      CognitoReceiver: ns-1512.awsdns-61.org,ns-944.awsdns-54.net,ns-45.awsdns-05.com,ns-1948.awsdns-51.co.uk
    production:
      Receiver: ns-944.awsdns-54.net,ns-1226.awsdns-25.org,ns-211.awsdns-26.com,ns-1828.awsdns-36.co.uk
      CognitoReceiver: ns-996.awsdns-60.net,ns-1534.awsdns-63.org,ns-2012.awsdns-59.co.uk,ns-35.awsdns-04.com

Resources:

  SignalExchangeHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - IsProduction
        - signal-exchange.account.gov.uk
        - !Sub 'signal-exchange.${Environment}.account.gov.uk'

  ##################
  # Mock Receiver  #
  ##################

  SharedSignalsMockReceiverApiPublicHostedZone:
    Condition: MockReceiverCustomDomain
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'mock-receiver.signal-exchange.${Environment}.account.gov.uk'

  SignalExchangeMockReceiverDnsDelegation:
    Condition: MockReceiverCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !GetAtt SignalExchangeHostedZone.Id
      Name: !Sub 'mock-receiver.signal-exchange.${Environment}.account.gov.uk'
      ResourceRecords: !GetAtt SharedSignalsMockReceiverApiPublicHostedZone.NameServers
      TTL: '300'
      Type: NS

  SharedSignalsMockReceiverApiCertificate:
    Condition: MockReceiverCustomDomain
    DependsOn: SignalExchangeMockReceiverDnsDelegation
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub 'mock-receiver.signal-exchange.${Environment}.account.gov.uk'
      DomainValidationOptions:
        - DomainName: !Sub 'mock-receiver.signal-exchange.${Environment}.account.gov.uk'
          HostedZoneId: !GetAtt SharedSignalsMockReceiverApiPublicHostedZone.Id
      ValidationMethod: DNS

  SharedSignalsMockReceiverApiDomainName:
    Condition: MockReceiverCustomDomain
    Type: AWS::ApiGateway::DomainName
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3002  # Required as EndpointAccessMode gets flagged as "Additional property not allowed" which means that cfn-lint does not recognise this property as valid even though it is, this is possibly a fairly new property added that cfn-lint has not been able to update its validation schema.
    Properties:
      DomainName: !Sub 'mock-receiver.signal-exchange.${Environment}.account.gov.uk'
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref SharedSignalsMockReceiverApiCertificate
      SecurityPolicy: SecurityPolicy_TLS13_1_2_PQ_2025_09
      EndpointAccessMode: BASIC  # STRICT may be too restrictive however with BASIC we already have DisableExecuteApiEndpoint: true

  SharedSignalsMockReceiverApiDomainNameParameter:
    Condition: MockReceiverCustomDomain
    Type: AWS::SSM::Parameter
    Properties:
      Name: MockReceiverApiDomainName
      Type: String
      Value: !Ref SharedSignalsMockReceiverApiDomainName

  SharedSignalsMockReceiverApiAliasRecord:
    Condition: MockReceiverCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SharedSignalsMockReceiverApiDomainName.RegionalDomainName
        EvaluateTargetHealth: false
        HostedZoneId: !GetAtt SharedSignalsMockReceiverApiDomainName.RegionalHostedZoneId
      HostedZoneId: !GetAtt SharedSignalsMockReceiverApiPublicHostedZone.Id
      Name: !Ref SharedSignalsMockReceiverApiDomainName
      Type: A

  ###############
  #  Transmitter  #
  ###############

  SharedSignalsTransmitterApiPublicHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - IsProduction
        - transmitter.signal-exchange.account.gov.uk
        - !Sub 'transmitter.signal-exchange.${Environment}.account.gov.uk'

  SignalExchangeTransmitterDnsDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !GetAtt SignalExchangeHostedZone.Id
      Name: !If
        - IsProduction
        - transmitter.signal-exchange.account.gov.uk
        - !Sub 'transmitter.signal-exchange.${Environment}.account.gov.uk'
      ResourceRecords: !GetAtt SharedSignalsTransmitterApiPublicHostedZone.NameServers
      TTL: '300'
      Type: NS

  SharedSignalsTransmitterApiCertificate:
    DependsOn: SignalExchangeTransmitterDnsDelegation
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !If
        - IsProduction
        - transmitter.signal-exchange.account.gov.uk
        - !Sub 'transmitter.signal-exchange.${Environment}.account.gov.uk'
      DomainValidationOptions:
        - DomainName: !If
            - IsProduction
            - transmitter.signal-exchange.account.gov.uk
            - !Sub 'transmitter.signal-exchange.${Environment}.account.gov.uk'
          HostedZoneId: !GetAtt SharedSignalsTransmitterApiPublicHostedZone.Id
      ValidationMethod: DNS

  SharedSignalsTransmitterApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3002 # Required as EndpointAccessMode gets flagged as "Additional property not allowed" which means that cfn-lint does not recognise this property as valid even though it is, this is possibly a fairly new property added that cfn-lint has not been able to update its validation schema.
    Properties:
      DomainName: !If
        - IsProduction
        - transmitter.signal-exchange.account.gov.uk
        - !Sub 'transmitter.signal-exchange.${Environment}.account.gov.uk'
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref SharedSignalsTransmitterApiCertificate
      SecurityPolicy: SecurityPolicy_TLS13_1_2_PQ_2025_09
      EndpointAccessMode: BASIC

  SharedSignalsTransmitterApiDomainNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: TransmitterApiDomainName
      Type: String
      Value: !Ref SharedSignalsTransmitterApiDomainName

  SharedSignalsTransmitterApiAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SharedSignalsTransmitterApiDomainName.RegionalDomainName
        EvaluateTargetHealth: false
        HostedZoneId: !GetAtt SharedSignalsTransmitterApiDomainName.RegionalHostedZoneId
      HostedZoneId: !GetAtt SharedSignalsTransmitterApiPublicHostedZone.Id
      Name: !Ref SharedSignalsTransmitterApiDomainName
      Type: A

  ###############################

  # Transmitter Cognito User Pool  #
  ################################

  SharedSignalsTransmitterCognitoPublicHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - IsProduction
        - auth.transmitter.signal-exchange.account.gov.uk
        - !Sub 'auth.transmitter.signal-exchange.${Environment}.account.gov.uk'

  SignalExchangeTransmitterCognitoDnsDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !GetAtt SignalExchangeHostedZone.Id
      Name: !If
        - IsProduction
        - auth.transmitter.signal-exchange.account.gov.uk
        - !Sub 'auth.transmitter.signal-exchange.${Environment}.account.gov.uk'
      ResourceRecords: !GetAtt SharedSignalsTransmitterCognitoPublicHostedZone.NameServers
      TTL: '300'
      Type: NS

  ####################################
  # Receiver DNS Delegation (Fraud SSF) #
  ####################################

  SignalExchangeReceiverDnsDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !GetAtt SignalExchangeHostedZone.Id
      Name: !If
        - IsProduction
        - receiver.signal-exchange.account.gov.uk
        - !Sub 'receiver.signal-exchange.${Environment}.account.gov.uk'
      ResourceRecords: !Split [',', !FindInMap [ReceiverNameServers, !Ref Environment, Receiver]]
      TTL: '300'
      Type: NS

  SignalExchangeReceiverCognitoDnsDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !GetAtt SignalExchangeHostedZone.Id
      Name: !If
        - IsProduction
        - auth.receiver.signal-exchange.account.gov.uk
        - !Sub 'auth.receiver.signal-exchange.${Environment}.account.gov.uk'
      ResourceRecords: !Split [',', !FindInMap [ReceiverNameServers, !Ref Environment, CognitoReceiver]]
      TTL: '300'
      Type: NS

Outputs:
  SignalExchangeHostedZoneId:
    Value: !GetAtt SignalExchangeHostedZone.Id
    Export:
      Name: SignalExchangeHostedZoneId
