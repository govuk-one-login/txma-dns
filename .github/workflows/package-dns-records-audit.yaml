name: Package DNS records for Audit account

on:
  push:
    branches:
      - main
    paths:
      - infrastructure/dns-records-audit/**
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-2

jobs:
  package:
    name: Package template
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python 3.8
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.8'
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310  # v3
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6.2.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AUDIT_DNS_RECORDS_GH_ACTIONS_ROLE_ARN }}
      - name: Package SAM app
        uses: govuk-one-login/devplatform-upload-action@64e46134b4108ebfa1cf2a64fee00782f8e2e8cf  # v4.1.0
        with:
          artifact-bucket-name: ${{ secrets.AUDIT_DNS_RECORDS_ARTIFACT_BUCKET_NAME }}
          signing-profile-name: ${{ secrets.AUDIT_SIGNING_PROFILE_NAME }}
          template-file: infrastructure/dns-records-audit/template.yaml
          working-directory: .
